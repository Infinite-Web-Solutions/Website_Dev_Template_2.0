name: Deploy

on:
  push:
    branches: [main]

jobs:
  # 1. Qualitäts-Gate: bei HTML-/CSS-Fehlern bricht der Workflow ab, es wird NICHT deployt
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Linting-Tools installieren
        run: npm install -g htmlhint stylelint stylelint-config-standard

      - name: Stylelint-Konfiguration sicherstellen (nur falls im Repo nicht vorhanden)
        run: |
          if [ ! -f .stylelintrc.json ] && [ ! -f .stylelintrc ] && [ ! -f stylelint.config.js ]; then
            echo '{"extends": "stylelint-config-standard"}' > .stylelintrc.json
          fi

      - name: HTML prüfen (Lint)
        run: htmlhint "public/**/*.html"

      - name: CSS prüfen (Lint)
        run: stylelint "public/assets/css/**/*.css"

  # 2. Deploy — läuft nur, wenn das Lint-Gate bestanden wurde
  deploy:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./public/
          # FTP_BASE_DIR = Webroot von infinitewebsolutions.de
          # Repo-Name wird automatisch als Unterverzeichnis angehängt
          server-dir: ${{ secrets.FTP_BASE_DIR }}/${{ github.event.repository.name }}/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map
          dangerous-clean-slate: false
          log-level: standard

      - name: Vorschau-URL ausgeben
        run: |
          echo ""
          echo "✅ Vorschau live unter:"
          echo "   https://infinitewebsolutions.de/${{ github.event.repository.name }}/"
          echo ""
