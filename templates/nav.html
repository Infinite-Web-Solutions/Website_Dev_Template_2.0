<!-- Sticky Navigationsleiste -->
<!-- Benötigt ein `<nav>` Tag und ARIA-Attribute für Barrierefreiheit -->
<header class="header js-header">
  <div class="container header__inner">
    <a href="index.html" class="header__logo" aria-label="Zur Startseite">
      <!-- Nutze Inline-SVG oder ein img-Tag. Z.B.: -->
      <span class="header__logo-text">Firmenname</span>
    </a>

    <!-- Mobile Menü Toggle -->
    <button class="header__toggle js-menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Menü öffnen">
      <span class="header__toggle-icon" aria-hidden="true"></span>
    </button>

    <!-- Hauptnavigation -->
    <nav id="main-nav" class="header__nav js-main-nav">
      <ul class="nav-list">
        <li class="nav-list__item"><a href="index.html" class="nav-list__link" aria-current="page">Startseite</a></li>
        <li class="nav-list__item"><a href="leistungen.html" class="nav-list__link">Leistungen</a></li>
        <li class="nav-list__item"><a href="ueber-uns.html" class="nav-list__link">Über uns</a></li>
        <li class="nav-list__item"><a href="kontakt.html" class="nav-list__link nav-list__link--button">Kontakt</a></li>
      </ul>
    </nav>
  </div>
</header>
