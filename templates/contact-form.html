<!-- Sicheres Kontaktformular -->
<!-- CSRF-Schutz erfolgt serverseitig per Same-Origin-Check in server/contact.php
     (Session-Tokens sind in statischem HTML nicht einbettbar). -->
<section class="contact-section section">
  <div class="container">
    <div class="contact-grid">

      <!-- Kontaktinformationen -->
      <div class="contact-info">
        <h2 class="section__title">Nehmen Sie Kontakt auf</h2>
        <p class="section__text">Wir freuen uns auf Ihre Anfrage und melden uns schnellstmöglich bei Ihnen zurück.</p>

        <address class="contact-details">
          <p><strong>Adresse:</strong><br> Musterstraße 1, 12345 Musterstadt</p>
          <p><strong>Telefon:</strong><br> <a href="tel:+49123456789">+49 123 456 789</a></p>
          <p><strong>E-Mail:</strong><br> <a href="mailto:info@beispiel.de">info@beispiel.de</a></p>
        </address>
      </div>

      <!-- Formular -->
      <div class="contact-form-wrapper">
        <!-- Relativer Pfad: funktioniert im Root UND im Test-Unterverzeichnis -->
        <form action="server/contact.php" method="POST" class="form js-contact-form" novalidate>

          <!-- Sicherheit: Honeypot-Feld (für Nutzer unsichtbar, fängt Bots ab)
               CSS: .form__group--hidden { position: absolute; left: -9999px; } -->
          <div class="form__group form__group--hidden" aria-hidden="true">
            <label for="website">Website (nicht ausfüllen)</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <div class="form__group">
            <label for="name" class="form__label">Name <span class="required" aria-label="Pflichtfeld">*</span></label>
            <input type="text" id="name" name="name" class="form__input" required aria-required="true"
                   aria-describedby="name-error" autocomplete="name">
            <span class="form__error" id="name-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form__group">
            <label for="email" class="form__label">E-Mail <span class="required" aria-label="Pflichtfeld">*</span></label>
            <input type="email" id="email" name="email" class="form__input" required aria-required="true"
                   aria-describedby="email-error" autocomplete="email">
            <span class="form__error" id="email-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form__group">
            <label for="message" class="form__label">Ihre Nachricht <span class="required" aria-label="Pflichtfeld">*</span></label>
            <textarea id="message" name="message" class="form__textarea" rows="5" required aria-required="true"
                      aria-describedby="message-error" minlength="10" maxlength="5000"></textarea>
            <span class="form__error" id="message-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form__group form__group--checkbox">
            <input type="checkbox" id="privacy" name="privacy" class="form__checkbox" required
                   aria-required="true" aria-describedby="privacy-error">
            <label for="privacy" class="form__label-checkbox">
              Ich habe die <a href="datenschutz.html" target="_blank" rel="noopener">Datenschutzerklärung</a> zur Kenntnis genommen. Ich stimme zu, dass meine Angaben zur Kontaktaufnahme gespeichert werden. <span class="required" aria-label="Pflichtfeld">*</span>
            </label>
            <span class="form__error" id="privacy-error" role="alert" aria-live="polite"></span>
          </div>

          <button type="submit" class="button button--primary form__submit">Nachricht senden</button>

          <!-- Formular-Statusmeldung (hidden-Attribut statt Inline-Style) -->
          <div class="form__status js-form-status" role="status" aria-live="polite" hidden></div>
        </form>
      </div>

    </div>
  </div>
</section>
